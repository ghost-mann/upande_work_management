<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Work Management">
  <!--
    Upande Work Management mark, the sibling of upande_crm's envelope and
    upande_irrigation's tap. Plays once on load: two meshed cogs turn against
    each other, planning, assigning and recording work, driving one another -
    then part, and the Upande arrow rises up between them and grows to full
    size. It comes to rest as the plain Upande arrow badge (the same artwork as
    upande-logo.png), so a tile that has finished animating is
    indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through <img>, where scripts never
    run anyway, and it is served to every desk user. With reduced motion set,
    only the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .spin-a { transform-box: view-box; transform-origin: 40px 57px;
              animation: spin-a 2.4s ease-in-out both; }
    .spin-b { transform-box: view-box; transform-origin: 65px 37.5px;
              animation: spin-b 2.4s ease-in-out both; }
    .part-a { transform-box: view-box; animation: part-a 2.4s ease-in both; }
    .part-b { transform-box: view-box; animation: part-b 2.4s ease-in both; }
    /* the big cog has 10 teeth, the small one 7: they turn in step, opposite ways */
    @keyframes spin-a {
      0%        { transform: rotate(0deg); }
      58%, 100% { transform: rotate(144deg); }
    }
    @keyframes spin-b {
      0%        { transform: rotate(0deg); }
      58%, 100% { transform: rotate(-205.7deg); }
    }
    @keyframes part-a {
      0%, 52%   { transform: translate(0, 0); opacity: 1; }
      76%, 100% { transform: translate(-16px, 10px); opacity: 0; }
    }
    @keyframes part-b {
      0%, 52%   { transform: translate(0, 0); opacity: 1; }
      76%, 100% { transform: translate(16px, -10px); opacity: 0; }
    }
    @keyframes rise {
      /* small and hidden behind the cogs, up through the gap they leave, then home */
      0%, 50%   { transform: translate(0, 14px) scale(.3); opacity: 0; }
      58%       { opacity: 1; }
      70%       { transform: translate(0, 2px) scale(.42); opacity: 1; }
      94%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { animation: none; }
      .part-a, .part-b { display: none; }
    }
  </style>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <!-- the Upande arrow, traced from upande-logo.png; drawn first so the cogs
       cover it until they part -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>

  <!-- big cog: 10 teeth around (40,57) -->
  <g class="part-a"><g class="spin-a">
    <g fill="#45433f">
      <rect x="36" y="35" width="8" height="8" rx="1.4"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(36 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(72 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(108 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(144 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(180 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(216 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(252 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(288 40 57)"/>
      <rect x="36" y="35" width="8" height="8" rx="1.4" transform="rotate(324 40 57)"/>
      <circle cx="40" cy="57" r="16"/>
    </g>
    <circle cx="40" cy="57" r="5.5" fill="#ffffff"/>
  </g></g>

  <!-- small cog: 7 teeth around (65,37.5), meshed into the big one -->
  <g class="part-b"><g class="spin-b">
    <g fill="#635e59">
      <rect x="62" y="21" width="6" height="6.5" rx="1.1"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(51.43 65 37.5)"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(102.86 65 37.5)"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(154.29 65 37.5)"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(205.71 65 37.5)"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(257.14 65 37.5)"/>
      <rect x="62" y="21" width="6" height="6.5" rx="1.1" transform="rotate(308.57 65 37.5)"/>
      <circle cx="65" cy="37.5" r="11"/>
    </g>
    <circle cx="65" cy="37.5" r="4" fill="#ffffff"/>
  </g></g>
</svg>
