<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Work Management">
  <!--
    Upande Work Management mark, the sibling of upande_crm's envelope and
    upande_irrigation's tap. Plays once on load: a crew of three walks in along
    the ground, stepping as they go, falls into a row, then steps up into a
    diagonal, the line the Upande arrow is drawn on, and the arrow rises
    through them as they fade. The work is done by people, and the arrow is
    made from where they stood. It comes to rest as the plain Upande arrow
    badge (the same artwork as upande-logo.png), so a tile that has finished
    animating is indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through an img element, where
    scripts never run, so it must also stay well-formed XML. With reduced
    motion set, only the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .w1 { transform-box: view-box; animation: walk1 2.4s ease-out both; }
    .w2 { transform-box: view-box; animation: walk2 2.4s ease-out both; }
    .w3 { transform-box: view-box; animation: walk3 2.4s ease-out both; }
    .bob { transform-box: view-box; animation: bob 2.4s linear both; }
    .ground { animation: ground 2.4s ease-in-out both; }
    /* the crew walks in as one line, keeping its spacing, then each steps up
       into the diagonal */
    @keyframes walk1 {
      0%        { transform: translate(-46px, 0); opacity: 0; }
      8%        { opacity: 1; }
      36%, 44%  { transform: translate(0, 0); opacity: 1; }
      56%, 60%  { transform: translate(-2px, 4px); opacity: 1; }
      70%, 100% { transform: translate(-2px, 4px); opacity: 0; }
    }
    @keyframes walk2 {
      0%        { transform: translate(-46px, 0); opacity: 0; }
      8%        { opacity: 1; }
      36%, 44%  { transform: translate(0, 0); opacity: 1; }
      56%, 60%  { transform: translate(-6px, -9px); opacity: 1; }
      70%, 100% { transform: translate(-6px, -9px); opacity: 0; }
    }
    @keyframes walk3 {
      0%        { transform: translate(-46px, 0); opacity: 0; }
      8%        { opacity: 1; }
      36%, 44%  { transform: translate(0, 0); opacity: 1; }
      56%, 60%  { transform: translate(-10px, -22px); opacity: 1; }
      70%, 100% { transform: translate(-10px, -22px); opacity: 0; }
    }
    /* a step: up and down while walking, still once in line */
    @keyframes bob {
      0%, 8%, 16%, 24%, 32% { transform: translate(0, 0); }
      4%, 12%, 20%, 28%     { transform: translate(0, -2.4px); }
      36%, 100%             { transform: translate(0, 0); }
    }
    @keyframes ground {
      0%, 50%   { opacity: 1; }
      64%, 100% { opacity: 0; }
    }
    @keyframes rise {
      /* small and hidden among the crew, then up through the line they made, then home */
      0%, 64%   { transform: translate(-3px, 8px) scale(.42); opacity: 0; }
      74%       { transform: translate(-1px, 4px) scale(.58); opacity: 1; }
      94%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { animation: none; }
      .w1, .w2, .w3, .ground { display: none; }
    }
  </style>
  <defs>
    <!-- walkers arriving from the left stay inside the badge -->
    <clipPath id="badge"><circle cx="50" cy="50" r="48.9"/></clipPath>
  </defs>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <!-- the Upande arrow, traced from upande-logo.png -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>

  <g clip-path="url(#badge)">
    <line class="ground" x1="12" y1="73" x2="88" y2="73" stroke="#c9c6bf" stroke-width="1.4" stroke-linecap="round"/>

    <!-- the crew: a head and a body each, in the arrow's own greys -->
    <g class="w1"><g class="bob">
      <circle cx="29" cy="47" r="6.2" fill="#45433f"/>
      <rect x="22" y="55" width="14" height="17.5" rx="7" fill="#45433f"/>
    </g></g>
    <g class="w2"><g class="bob" style="animation-delay:-.06s">
      <circle cx="50" cy="47" r="6.2" fill="#635e59"/>
      <rect x="43" y="55" width="14" height="17.5" rx="7" fill="#635e59"/>
    </g></g>
    <g class="w3"><g class="bob" style="animation-delay:-.12s">
      <circle cx="71" cy="47" r="6.2" fill="#1c1b19"/>
      <rect x="64" y="55" width="14" height="17.5" rx="7" fill="#1c1b19"/>
    </g></g>
  </g>
</svg>
